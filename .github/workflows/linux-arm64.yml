name: Linux ARM64 build (for Android via Termux)

on:
  workflow_dispatch:
  push:
    branches: [android-arm64]

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 355
    defaults:
      run:
        working-directory: haskell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: System packages
        run: |
          sudo ./pre-dependencies
          sudo apt-get install -y xvfb imagemagick xdotool file libglib2.0-0 libfuse2 zenity

      - name: Submodule revisions
        run: echo "SUBMODS=$(git submodule status --recursive | sha1sum | cut -c1-16)" >> $GITHUB_ENV

      - name: Cache C dependencies
        id: cdeps
        uses: actions/cache@v4
        with:
          path: haskell/dependencies/root
          key: cdeps-arm64-${{ hashFiles('haskell/dependencies/Makefile') }}-${{ env.SUBMODS }}

      - name: Build C dependencies
        if: steps.cdeps.outputs.cache-hit != 'true'
        run: ./build-dependencies

      - name: Install Stack
        run: |
          curl -sSL https://github.com/commercialhaskell/stack/releases/download/v3.11.1/stack-3.11.1-linux-aarch64.tar.gz -o stack.tgz
          sudo tar xzf stack.tgz --strip-components=1 -C /usr/local/bin stack-3.11.1-linux-aarch64/stack
          rm stack.tgz
          stack --version

      - name: Restore Stack cache
        id: stackcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
            haskell/packages/*/.stack-work
          key: stack-arm64-${{ hashFiles('haskell/stack.yaml', 'haskell/packages/*/package.yaml', 'haskell/packages/*/*.cabal') }}-${{ github.sha }}
          restore-keys: |
            stack-arm64-${{ hashFiles('haskell/stack.yaml', 'haskell/packages/*/package.yaml', 'haskell/packages/*/*.cabal') }}-
            stack-arm64-

      - name: Build Haskell dependencies
        run: ./stack-local build --only-dependencies

      - name: Save Stack cache (dependencies)
        if: always() && steps.stackcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
            haskell/packages/*/.stack-work
          key: stack-arm64-${{ hashFiles('haskell/stack.yaml', 'haskell/packages/*/package.yaml', 'haskell/packages/*/*.cabal') }}-${{ github.sha }}

      - name: Build Onyx
        run: |
          ./stack-local build onyx-lib
          ./stack-local build onyx-lib-game
          ./stack-local build

      - name: Package AppDir
        run: |
          ./copy-resources
          curl -sSL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage -o linuxdeploy
          chmod +x linuxdeploy
          sed '0,/AI\x02/{s|AI\x02|\x00\x00\x00|}' -i linuxdeploy
          ./linuxdeploy --appimage-extract >/dev/null
          rm -rf Onyx.AppDir/usr/bin/* Onyx.AppDir/usr/lib/* Onyx.AppDir/usr/share/metainfo/*
          stack exec which onyx | xargs -I{} cp {} Onyx.AppDir/usr/bin/onyx
          strip Onyx.AppDir/usr/bin/onyx
          cp -R resources Onyx.AppDir/usr/bin/onyx-resources
          cp icon/icon.png Onyx.AppDir/usr/share/icons/hicolor/256x256/apps/onyx.png
          cp org.onyxite.onyx.appdata.xml Onyx.AppDir/usr/share/metainfo/
          stack exec -- onyx-package changes
          stack exec -- onyx-package version-write Onyx.AppDir/usr/share/metainfo/org.onyxite.onyx.appdata.xml Onyx.AppDir/usr/bin/onyx-resources/README.html
          VERSION=$(stack exec -- onyx-package version-print)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          env LD_LIBRARY_PATH="$(pwd)"/dependencies/root/lib VERSION=$VERSION squashfs-root/AppRun --appdir Onyx.AppDir \
            --exclude-library 'libpango*' --exclude-library 'libcairo*' --exclude-library 'libglib-2.0*' \
            --exclude-library 'libgobject-2.0*' --exclude-library 'libXft*' \
            --exclude-library 'libGL*' --exclude-library 'libEGL*' --exclude-library 'libdrm*'
          tar czf ../onyx-$VERSION-linux-arm64.tar.gz Onyx.AppDir

      - name: Smoke test (GUI under Xvfb)
        run: |
          Xvfb :5 -screen 0 1280x800x24 & sleep 2
          (DISPLAY=:5 timeout 40 Onyx.AppDir/AppRun > ../smoke.log 2>&1 || true) &
          sleep 30
          DISPLAY=:5 import -window root ../smoke.png || true
          sleep 12
          cat ../smoke.log || true
          file Onyx.AppDir/usr/bin/onyx | tee -a ../smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-linux-arm64
          path: |
            onyx-*-linux-arm64.tar.gz
            smoke.png
            smoke.log
